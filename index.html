<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSC Business Center · Prospection et diagnostic</title><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap"><style>:root{--bg:#F7F6FB;--surface:#fff;--ink:#1C1842;--muted:#5B5878;--line:#DEDCEC;--brand:#29235C;--brand-ink:#fff;--accent:#E6007E;--wash:#EEECF8;--ok:#1B7A4B;--warn:#B26A00;--danger:#B3261E;--f:"Public Sans","Segoe UI",system-ui,sans-serif;--fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f)}
h1,h2,h3{font-family:var(--fd);line-height:1.2;margin:0 0 10px}
h1{font-size:1.7rem}h2{font-size:1.25rem}h3{font-size:1.02rem}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.sr{position:absolute;left:-9999px}
/* layout */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--brand);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.side img{width:150px;margin:2px 6px 14px}
.side nav{display:grid;gap:4px}
.side a.nv{display:flex;justify-content:space-between;align-items:center;color:#d9d6f5;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:500}
.side a.nv:hover{background:rgba(255,255,255,.08)}
.side a.nv[aria-current=page]{background:var(--accent);color:#fff}
.side .cnt{background:rgba(255,255,255,.18);border-radius:99px;font-size:12px;padding:1px 8px}
.side .foot{margin-top:auto;font-size:12px;color:#aaa6d8;padding:6px}
main{padding:24px clamp(14px,3vw,36px) 60px;min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side img{width:110px;margin:0 8px 0 0}.side nav{display:flex;flex-wrap:wrap}.side .foot{display:none}}
/* ui */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(.93)}
.btn.line{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.dark{background:var(--brand)}
.btn.ok{background:#1b9f5c}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:14px}
.kpi b{display:block;font:800 1.7rem var(--fd)}
.kpi span{color:var(--muted);font-size:13px}
.kpi.warn{border-top-color:var(--warn)}.kpi.bad{border-top-color:var(--danger)}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fld{margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--wash);color:var(--brand);white-space:nowrap}
.st-0{background:#e9e7fb}.st-1{background:#fde7f3;color:#a40058}.st-2{background:#fff0d6;color:#8a5200}.st-3{background:#dff0ff;color:#0b5aa6}.st-4{background:#ffe3df;color:#a3281b}.st-5{background:#dcf5e7;color:#14693f}.st-6{background:#e8e8ee;color:#555}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th,.tb td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tb th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tb tr.clk{cursor:pointer}.tb tr.clk:hover{background:var(--wash)}
.tbw{overflow-x:auto}
.late{color:var(--danger);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a[aria-current=page]{color:var(--brand);border-bottom-color:var(--accent)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:13.5px}
.bar i{display:block;height:14px;background:var(--wash);border-radius:7px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--accent);border-radius:7px}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--wash);border-radius:12px;padding:10px;min-height:140px}
.col h3{display:flex;justify-content:space-between;font-size:.9rem}
.col.over{outline:2px dashed var(--accent)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:13.5px}
.kc b{display:block}
.kc .m{color:var(--muted);font-size:12.5px}
/* diagnostic */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{position:relative;margin:0;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;background:#fff;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}
.seg input:checked+span{display:block}
.seg label:has(input:checked){background:var(--brand);color:#fff}
.seg label.l0:has(input:checked){background:#b3261e}.seg label.l1:has(input:checked){background:#b26a00}.seg label.l2:has(input:checked){background:#1b7a4b}
.need{display:grid;grid-template-columns:200px auto 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:760px){.need{grid-template-columns:1fr}}
.reco{border:2px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.reco.top{border-color:var(--accent)}
/* devis builder */
.qgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.qgrid{grid-template-columns:1fr}}
.qopt{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:#fff;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:400;margin-bottom:6px}
.qopt:has(input:checked){border-color:var(--accent);background:var(--wash)}
.qopt input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.qopt .n{flex:1}.qopt .p{font-weight:800;white-space:nowrap}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font:700 12px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 0 6px}
.sum{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px}
.sum .l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum .l.big{font-size:1.2rem;font-weight:800;color:var(--accent);border:0}
ul.gl,ol.gl{margin:6px 0 12px;padding-left:20px}ul.gl li,ol.gl li{margin-bottom:5px}
.sheet h3{margin:16px 0 6px;color:var(--brand)}.sheet .qa{margin-bottom:8px;break-inside:avoid}.sheet .ans{min-height:30px;border-bottom:1px dotted #888;padding:2px 0;font-size:13px;white-space:pre-wrap}
/* rapport */
.rp-top{display:flex;gap:18px;align-items:center;background:#F7F6FB;border-radius:10px;padding:12px 16px;margin:10px 0}
.rp-score{min-width:150px;text-align:center}.rp-score b{display:block;font:800 2.4rem var(--fd);color:var(--accent);line-height:1}.rp-score small{font-size:1rem;color:#555}.rp-score span{display:block;font-size:12px;color:#555}.rp-score em{display:inline-block;margin-top:4px;background:var(--brand);color:#fff;border-radius:99px;padding:2px 12px;font-style:normal;font-size:12px;font-weight:700}
.rpb{margin:6px 0 10px}.rpr{display:grid;grid-template-columns:200px 1fr 80px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px}.rpr i{display:block;height:14px;background:#E8E6F4;border-radius:7px;overflow:hidden}.rpr i b{display:block;height:100%}.rpr em{font-style:normal;font-weight:700;font-size:12.5px}
.rpk{border-left:5px solid var(--accent);background:#FAFAFD;padding:8px 14px;margin:10px 0;border-radius:0 8px 8px 0;break-inside:avoid}.rpk p{margin:5px 0}
.rp h3{margin-top:18px}@media(max-width:700px){.rpr{grid-template-columns:1fr}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* modal / sheet */
.modal{position:fixed;inset:0;background:rgba(20,16,50,.6);z-index:50;overflow:auto;padding:20px}
.modal .box{background:#fff;max-width:860px;margin:0 auto;border-radius:12px;padding:20px}
.modal .bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sheet{font-size:14px;color:#111}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:16px}
.sheet header img{width:150px}
.sheet h2{font-size:1.5rem;color:var(--brand)}
.sheet table{width:100%;border-collapse:collapse;margin:12px 0}
.sheet th{background:var(--brand);color:#fff;text-align:left;padding:8px;font-size:12px}
.sheet td{padding:8px;border-bottom:1px solid #ddd}
.sheet .r{text-align:right;white-space:nowrap}
.sheet .tot td{font-weight:800;font-size:1.05rem;border-top:2px solid var(--brand)}
.sheet .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
.sheet .sig div{border-top:1px solid #333;padding-top:6px;font-size:12px;height:90px}
.sheet .fine{font-size:12px;color:#555;margin-top:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.empty{text-align:center;padding:30px;color:var(--muted)}
.hist li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist{list-style:none;margin:0;padding:0}
@media print{
  body{background:#fff}
  .app,.noprint,.toast{display:none!important}
  .modal{position:static;background:none;padding:0;overflow:visible}
  .modal .box{max-width:none;padding:0;box-shadow:none;margin:0}
  .sheet .sig{page-break-inside:avoid}
  @page{margin:14mm}
}
.mkfilters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:12px 0}@media(max-width:760px){.mkfilters{grid-template-columns:1fr}}
.pcdone{opacity:.5}details.card summary{cursor:pointer}
#autostat{position:fixed;right:12px;bottom:12px;z-index:40;font-size:.78rem;padding:5px 12px;border-radius:20px;background:#fff;border:1px solid #cfd8d3;color:#1B7A4B;box-shadow:0 1px 4px rgba(0,0,0,.12);pointer-events:none}#autostat.ko{color:#a3281b;border-color:#e6b4ad}@media print{#autostat{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{display:inline-block;background:var(--wash);color:var(--brand);border-radius:99px;padding:2px 10px;font-size:12.5px}

/* ---------- utilitaires ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function digits(s){return String(s==null?'':s).replace(/\D+/g,'');}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function pad(n,l){n=String(n);while(n.length<l)n='0'+n;return n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);}
function today(){return iso(new Date());}
function addDays(s,n){var d=s?new Date(s+'T12:00:00'):new Date();d.setDate(d.getDate()+n);return iso(d);}
function fdate(s){if(!s)return '';var p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function validEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s||'').trim());}

var KEYPIN='gscPlat_pin';
function cyrb(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);}
function hashPin(pin){
  var s='gsc|'+pin;
  try{if(window.crypto&&crypto.subtle&&window.TextEncoder){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return 's:'+Array.prototype.map.call(new Uint8Array(b),function(x){return pad(x.toString(16),2);}).join('');});}}catch(e){}
  return Promise.resolve('c:'+cyrb(s));
}
function pinSet(){try{return !!localStorage.getItem(KEYPIN);}catch(e){return false;}}
function pinCheck(pin){var st=localStorage.getItem(KEYPIN)||'';if(st.charAt(0)==='c')return Promise.resolve(st==='c:'+cyrb('gsc|'+pin));return hashPin(pin).then(function(h){return st===h;});}

var LV=['Manquant','Partiel','Acquis'];
function diagScore(dg){
  if(!dg)return null;
  var tot=0,n=0;NEEDS.forEach(function(x){var v=dg.needs&&dg.needs[x[0]];if(v!=null&&v!==''){tot+=parseInt(v,10)*50;n++;}});
  if(!n)return null;
  var s=Math.round(tot/n),lab=s<25?'Démarrage':s<50?'Structuration':s<75?'Développement':'Accélération';
  return {score:s,label:lab};
}
function recommend(dg,stade){
  var miss={};NEEDS.forEach(function(x){var v=dg&&dg.needs?dg.needs[x[0]]:null;miss[x[0]]=v==null||v===''?0:(v==0?2:v==1?1:0);});
  var out=CATALOG.map(function(p){
    var g=0,cov=[];p.needs.forEach(function(n){if(miss[n]>0){g+=miss[n];cov.push(n);}});
    var bonus=0;
    if(stade===STADES[0]&&(p.id===1||p.id===8))bonus=2;
    if(stade===STADES[1]&&(p.id===1||p.id===8||p.id===4))bonus=1;
    if(stade===STADES[2]&&(p.id===6||p.id===2||p.id===4))bonus=1;
    if(stade===STADES[3]&&(p.id===7||p.id===9||p.id===10))bonus=1;
    var pr=cat(p.id).price;
    return {p:p,g:g,cov:cov,score:g+bonus-pr/600000,price:pr};
  }).filter(function(r){return r.g>0;});
  out.sort(function(a,b){return b.score-a.score;});
  return out.slice(0,3);
}
var OPTS=[['comptant','Paiement comptant (100 % à la signature)'],['fidele','Client fidèle (2e projet ou plus)'],['jeune','Jeune entreprise ou porteur de projet (moins d’un an)'],['asso','Association, coopérative ou ONG locale'],['groupe','Groupe de 3 clients ou plus qui s’inscrivent ensemble']];
function calcDevis(ids,o){
  var rows=ids.map(function(i){return cat(i);}).filter(Boolean);
  var fo=rows.filter(function(p){return !p.monthly;}),mo=rows.filter(function(p){return p.monthly;});
  var sum=0;OPTS.forEach(function(x){if(o[x[0]])sum+=5;});if(rows.length>=2)sum+=10;
  var list=0,maj=0;fo.forEach(function(p){list+=p.price;});
  if(o.renf)maj=list*0.25;
  var rem=(list+maj)*sum/100,net=list+maj-rem;
  return {rows:rows,fo:fo,mo:mo,rate:sum,list:list,maj:maj,rem:rem,net:net,monthTotal:mo.reduce(function(a,p){return a+p.price;},0)};
}

}

function parseOrder(t){
  t=String(t||'');
  function g(re){var m=t.match(re);return m?m[1].trim():'';}
  var o={nom:g(/^\s*Nom\s*:\s*(.+)$/mi),telephone:g(/^\s*T[ée]l[ée]phone\s*:\s*(.+)$/mi),email:g(/^\s*E-?mail\s*:\s*(.+)$/mi),entreprise:g(/^\s*Entreprise[^:\n]*:\s*(.+)$/mi)};
  var ids=[],re=/^\s*-\s*(\d{1,2})\.\s/mg,m;
  while((m=re.exec(t))){var n=parseInt(m[1],10);if(cat(n)&&ids.indexOf(n)<0)ids.push(n);}
  if(!ids.length){CATALOG.forEach(function(c){if(t.toLowerCase().indexOf(c.name.toLowerCase())>-1)ids.push(c.id);});}
  var pay=g(/^\s*Paiement\s*:\s*(.+)$/mi).toLowerCase(),rem=g(/^\s*Remises demand[ée]es\s*:\s*(.+)$/mi).toLowerCase();
  var opts={comptant:pay.indexOf('comptant')>-1,fidele:rem.indexOf('fid')>-1,jeune:rem.indexOf('jeune')>-1,asso:rem.indexOf('association')>-1,groupe:rem.indexOf('groupe')>-1,renf:/formule renforc[ée]e\s*:\s*oui/i.test(t)};
  var after=t.split(/Montant indicatif[^\n]*\n?/i)[1]||'';
  return {o:o,ids:ids,opts:opts,notes:after.trim()};
}

function mkParseCsv(t){
  t=String(t).replace(/^\uFEFF/,'');
  var sep=(t.split('\n')[0].split(';').length>=t.split('\n')[0].split(',').length)?';':',',rows=[],r=[],c='',q=false,i,ch;
  for(i=0;i<t.length;i++){ch=t.charAt(i);
    if(q){if(ch==='"'){if(t.charAt(i+1)==='"'){c+='"';i++;}else q=false;}else c+=ch;}
    else if(ch==='"')q=true;
    else if(ch===sep){r.push(c);c='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t.charAt(i+1)==='\n')i++;r.push(c);c='';if(r.join('').trim())rows.push(r);r=[];}
    else c+=ch;}
  r.push(c);if(r.join('').trim())rows.push(r);return rows;
}

  var hd=rows[0].map(function(h){return map[h.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z-]/g,'').replace('e-mail','email')]||'';});
  var all=mkAll(),add=0,dup=0;
  rows.slice(1).forEach(function(r){
    var o={};hd.forEach(function(k,i){if(k&&r[i])o[k]=r[i].trim();});
    if(!o.nom||(!o.email&&!o.telephone))return;
    var d=all.some(function(x){return (o.email&&x.o.email&&x.o.email.toLowerCase()===o.email.toLowerCase())||(o.telephone&&x.o.telephone&&digits(x.o.telephone)===digits(o.telephone));});

    o.id='C-'+pad(m.cseq++,4);o.created=today();m.contacts.push(o);all.push({k:o.id,t:'c',o:o});add++;
  });
  save();toast(add+' contact(s) importé(s)'+(dup?', '+dup+' doublon(s) ignoré(s)':'')+'.');mkRefresh();
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-mk]');if(!el||e.target.closest('a'))return;
  var a=el.dataset.mk,d=el.dataset,m=MK(),x,c,q;
  if(a==='send'||a==='send-next'){q=mkQueue().filter(function(i){return a==='send-next'||i.key===d.key;})[0];if(q)mkDo(q);else toast('Aucune relance à envoyer.');}
  else if(a==='webhook')mkHook();
  else if(a==='ct-new')mkContactModal('');
  else if(a==='ct-open')mkContactModal(d.k);
  else if(a==='ct-export')mkExport();
  else if(a==='ct-import'){var fi=document.createElement('input');fi.type='file';fi.accept='.csv,text/csv';fi.onchange=function(){if(fi.files[0]){var rd=new FileReader();rd.onload=function(){mkImport(rd.result);};rd.readAsText(fi.files[0],'utf-8');}};fi.click();}
  else if(a==='ct-del'){if(confirm('Supprimer ce contact ?')){m.contacts=m.contacts.filter(function(o){return o.id!==d.k;});save();$('#modal').innerHTML='';mkRefresh();}}
  else if(a==='cp-new')mkCampModal('');
  else if(a==='cp-edit')mkCampModal(d.c);
  else if(a==='cp-del'){if(confirm('Supprimer cette campagne ?')){m.camps=m.camps.filter(function(k){return k.id!==d.c;});save();location.hash='#/marketing/campagnes';}}
  else if(a==='cp-state'){c=mkCamp(d.c);c.statut=d.s;save();mkRefresh();}
  else if(a==='cp-send'){
    c=mkCamp(d.c);x=mkFind(d.k);if(!c||!x)return;
    var t=mkFill(c.msg,x.o),url=d.ch==='whatsapp'?mkWa(x.o,t+'\n\nPour ne plus recevoir nos messages, répondez STOP.'):mkMailUrl(x.o.email,mkFill(c.subj,x.o),mkBody(t,x.o,true));
    if(!url)return;
    mkOpen(url);(c.sent=c.sent||{})[d.k+'|'+d.ch]=today();if(c.statut==='Brouillon')c.statut='En cours';
    mkLog(x,'camp:'+c.id,'Campagne « '+c.nom+' »',d.ch);save();mkRefresh();
  }
  else if(a==='cp-bcc'){
    c=mkCamp(d.c);
    var rec=mkSeg(c.seg).filter(function(y){return validEmail(y.o.email)&&!(c.sent||{})[y.k+'|email'];}).slice(0,50);
    if(!rec.length){toast('Aucun e-mail en attente.');return;}
    mkOpen(mkMailUrl('',c.subj,mkBody(mkFill(c.msg,{nom:'Madame, Monsieur',entreprise:''}),{},true),rec.map(function(y){return y.o.email;}).join(',')));
    if(confirm('Marquer ces '+rec.length+' contact(s) comme envoyés ?')){rec.forEach(function(y){(c.sent=c.sent||{})[y.k+'|email']=today();mkLog(y,'camp:'+c.id,'Campagne « '+c.nom+' » (groupé)','email');});if(c.statut==='Brouillon')c.statut='En cours';save();mkRefresh();}
  }
  else if(a==='cp-csv'){
    c=mkCamp(d.c);
    download('campagne-'+c.id+'-'+today()+'.csv','\uFEFF'+['nom;email;telephone;message'].concat(mkSeg(c.seg).map(function(y){return [y.o.nom,y.o.email,digits(y.o.telephone),mkFill(c.msg,y.o)].map(csvCell).join(';');})).join('\r\n'),'text/csv;charset=utf-8');
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-mkform]');if(!f)return;
  e.preventDefault();
  var m=MK(),fd=new FormData(f),v={},msg=AUTO?{}:$('#mkmsg');
  fd.forEach(function(val,k){if(k!=='st')v[k]=String(val).trim();});
  if(f.dataset.mkform==='ct'){
    var x=f.dataset.k?mkFind(f.dataset.k):null;
    v.mkStop=fd.has('mkStop');
    if(!x||x.t==='c'){
      if((v.nom||'').length<2){msg.textContent='Indiquez le nom du contact.';return;}
      if(v.email&&!validEmail(v.email)){msg.textContent='Adresse e-mail invalide.';return;}
      if(!v.email&&!v.telephone){msg.textContent='Indiquez un e-mail ou un téléphone.';return;}
    }
    if(!x){v.id='C-'+pad(m.cseq++,4);v.created=today();m.contacts.push(v);f.dataset.k=v.id;}
    else if(x.t==='c')Object.assign(x.o,v);
    else{x.o.tags=v.tags;x.o.mkStop=v.mkStop;}
    save();if(AUTO)return;$('#modal').innerHTML='';mkRefresh();toast('Contact enregistré.');
  }else{
    if((v.nom||'').length<2){msg.textContent='Donnez un nom à la campagne.';return;}
    if(!v.msg){msg.textContent='Rédigez le message.';return;}
    var seg={type:v.type,st:fd.getAll('st'),tag:v.tag,sect:v.sect},c=f.dataset.id?mkCamp(f.dataset.id):null;
    if(c)Object.assign(c,{nom:v.nom,canal:v.canal,subj:v.subj,msg:v.msg,date:v.date,seg:seg});
    else{c={id:'K-'+pad(m.kseq++,3),nom:v.nom,canal:v.canal,subj:v.subj,msg:v.msg,date:v.date,seg:seg,statut:'Brouillon',sent:{},created:today()};m.camps.push(c);f.dataset.id=c.id;}

  }
});

function pcOffreTxt(l){var r=pcReco(l)[0];return r?' (projet envisagé : '+r.name+')':'';}
function pcCovering(k){return CATALOG.filter(function(p){return p.needs.indexOf(k)>=0;});}
function pcPrixTxt(id){var c=cat(id);return fmt(c.price)+' FCFA'+(c.monthly?' / mois':'');}
function pcMedian(a){a=a.slice().sort(function(x,y){return x-y;});var n=a.length;return n%2?a[(n-1)/2]:Math.round((a[n/2-1]+a[n/2])/2);}
function pcReco(l){
  var N=(l.besoins||[]).filter(function(k){return PC_NB[k];});
  if(!N.length)return [];
  return CATALOG.map(function(p){var cov=p.needs.filter(function(k){return N.indexOf(k)>=0;}).length;return {id:p.id,cov:cov,extra:p.needs.length-cov};})
   .filter(function(x){return x.cov>0;})
   .sort(function(a,b){return (b.cov-a.cov)||(a.extra-b.extra)||(cat(a.id).price-cat(b.id).price);})
   .slice(0,3).map(function(x){var c=cat(x.id);return {id:c.id,name:c.name,price:c.price,monthly:c.monthly,cov:x.cov,total:N.length,extra:x.extra};});
}

function pcPlanState(){

  var days=Math.floor((new Date(today()+'T12:00:00')-new Date(st+'T12:00:00'))/864e5);

  return {o:o,st:st,days:days,w:w,ph:w<=2?0:w<=6?1:w<=10?2:3};
}
function pcStratStats(st){
  var L=PC().leads.filter(function(l){return (l.contacts||[]).some(function(c){return c.d>=st;});});
  var ok=function(l){return l.reponse!=='defavorable';};
  return {c:L.length,
    r:L.filter(function(l){return l.reponse==='favorable'||(l.etape>=4&&ok(l));}).length,
    d:L.filter(function(l){return l.etape>=5&&ok(l);}).length,
    p:L.filter(function(l){return l.etape>=6&&ok(l);}).length,
    g:L.filter(function(l){return l.issue==='gagné';}).length};
}

function pcStratFunnel(ps){
  var o=ps.o,t1=o.t1/100,t2=o.t2/100,t3=o.t3/100,t4=o.t4/100,prod=t1*t2*t3*t4,sign=o.sign;
  var med=pcMedian(CATALOG.map(function(p){return cat(p.id).price;})),panier=o.panier>0?o.panier:med;
  var C=prod>0?Math.ceil(sign/prod):0,R=Math.ceil(C*t1),D=Math.ceil(R*t2),Pp=Math.ceil(D*t3),G=sign;
  var wk=Math.max(ps.days,0)/7,f=Math.min(wk,52)/4.345,real=pcStratStats(ps.st);
  var rows=[['Premiers contacts envoyés',C,real.c],['Réponses favorables',R,real.r],['Diagnostics planifiés',D,real.d],['Propositions envoyées',Pp,real.p],['Clients gagnés',G,real.g]];
  var tb='<div class="tbw"><table class="tb"><thead><tr><th>Étape de l’entonnoir</th><th>Objectif par mois</th><th>Objectif par semaine</th><th>Objectif cumulé à ce jour</th><th>Réalisé depuis le début du plan</th></tr></thead><tbody>'+rows.map(function(r,i){var cum=Math.round(r[1]*f);return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+Math.ceil(r[1]/4.345)+'</td><td>'+cum+'</td><td><span class="tag '+(r[2]>=cum&&cum>0?'st-5':r[2]>0?'st-2':'st-0')+'">'+r[2]+'</span></td></tr>';}).join('')+'<tr><td><b>Chiffre d’affaires visé</b></td><td>'+fmt(sign*panier)+' FCFA</td><td colspan="3" class="small muted">'+sign+' client(s) par mois × panier moyen de '+fmt(panier)+' FCFA</td></tr></tbody></table></div>';

}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-pcs]');if(!el)return;
  var a=el.dataset.pcs,P=PC(),k=el.dataset.k;
  if(a==='need'){var o=P.opt,i=o.besoins.indexOf(k);if(i>=0)o.besoins.splice(i,1);else o.besoins.push(k);if(o.besoins.length&&o.eng.indexOf('bes')<0)o.eng.push('bes');save();mkRefreshPc();}
  else if(a==='chk'){if(P.plan.done[k])delete P.plan.done[k];else P.plan.done[k]=today();save();mkRefreshPc();}
  else if(a==='go'){location.hash='#/prosp/'+el.dataset.t;}
  else if(a==='plan-reset'){if(confirm('Remettre à zéro la progression du plan en 12 semaines ?')){P.plan.done={};save();mkRefreshPc();}}
  else if(a==='start-now'){P.plan.obj.start=today();save();mkRefreshPc();}
});
document.addEventListener('change',function(e){
  var el=e.target;if(!el)return;
  if(el.dataset&&el.dataset.pcso){
    var o=PC().plan.obj,k=el.dataset.pcso,v=el.value;
    if(k==='start'){if(/^\d{4}-\d{2}-\d{2}$/.test(v))o.start=v;}
    else{var n=parseFloat(String(v).replace(',','.'));if(isNaN(n)||n<0)n=0;if(k==='sign'&&n<1)n=1;if(/^t\d$/.test(k)&&n>100)n=100;o[k]=n;}
    save();mkRefreshPc();return;
  }
  if(el.name==='besoins'&&el.type==='checkbox'){
    var f=el.closest('form');if(!f)return;
    var N=[].slice.call(f.querySelectorAll('input[name="besoins"]:checked')).map(function(x){return x.value;});
    var b=document.getElementById('pcreco');if(b)b.innerHTML=pcRecoHtml(N);
  }
});

var syncing=false,syncTimer=null;
function syncOn(){return !!(S.settings.syncUrl&&S.settings.syncKey);}

function remoteToOrder(od){
  var x=od.data||{},rem=Array.isArray(x.remises)?x.remises:[];
  var ids=[];
  (Array.isArray(x.projects)?x.projects:[]).forEach(function(q){var n=parseInt(q&&q.n,10);if(cat(n)&&ids.indexOf(n)<0)ids.push(n);});
  var notes=String(x.message||'');
  if(x.type!=='commande'&&x.subject)notes=(x.subject+(notes?' : ':'')+notes);
  return {o:{nom:String(x.name||'').trim(),telephone:String(x.phone==null?'':x.phone).trim(),email:String(x.email||'').trim(),entreprise:String(x.company||'').trim()},ids:ids,opts:{comptant:String(x.paiement||'')==='comptant',fidele:rem.indexOf('fidele')>-1,jeune:rem.indexOf('jeune')>-1,asso:rem.indexOf('asso')>-1,groupe:rem.indexOf('groupe')>-1,renf:!!x.renf},notes:notes};
}
function syncMsg(m){var e=$('#syncmsg');if(e)e.textContent=m;}
function syncOrders(manual){
  if(!syncOn()){if(manual)toast('Renseignez d’abord la connexion dans Paramètres.');return Promise.resolve();}
  if(syncing)return Promise.resolve();
  syncing=true;
  if(manual)syncMsg('Synchronisation en cours…');
  return fetch(syncUrlFor('list')).then(function(r){return r.text();}).then(function(t){
    var j;try{j=JSON.parse(t);}catch(e){throw new Error('page');}
    if(j.status!=='ok')throw new Error(j.message||'service');
    var done=S.settings.syncDone||(S.settings.syncDone=[]),ids=[],n=0,last=null;
    (j.orders||[]).forEach(function(od){
      ids.push(od.id);
      if(done.indexOf(od.id)>-1)return;
      var r=remoteToOrder(od);
      if(r.o.nom.length<2)return;
      var res=applyOrder(r,r.ids.length?'Site web (commande)':'Site web (contact)');
      done.push(od.id);n++;last=res;
    });
    while(done.length>500)done.shift();
    S.settings.lastSync=new Date().toISOString();
    save();
    if(ids.length)fetch(syncUrlFor('ack','&ids='+encodeURIComponent(ids.join(',')))).catch(function(){});
    if(n){
      toast(n===1?'1 nouvelle demande reçue du site.':n+' nouvelles demandes reçues du site.');
      var rt=route();
      if(!$('#modal').innerHTML&&(rt.v==='dash'||rt.v==='prospects'||rt.v==='pipeline'))render();
    }else if(manual)toast('Aucune nouvelle commande.');
    syncMsg('Dernière synchronisation : '+new Date().toLocaleString('fr-FR')+(n?' · '+n+' reçue(s)':''));
  }).catch(function(e){
    var m=e&&e.message,txt;
    if(m==='page')txt='Le service répond avec une page Google au lieu des données. Vérifiez que l’accès du déploiement est réglé sur « Tout le monde ».';
    else if(m==='code incorrect')txt='Le code secret ne correspond pas à celui du script.';
    else if(m==='CODE_NON_MODIFIE')txt='Dans le script Google, le code est encore « CHANGEZ-MOI ». Remplacez-le par votre code, enregistrez, puis Déployer → Gérer les déploiements → crayon → Nouvelle version → Déployer.';
    else if(m==='CODE_TROP_COURT')txt='Le code du script Google est trop court : 8 caractères minimum. Modifiez-le, enregistrez, puis republiez une Nouvelle version.';
    else if(m&&m.indexOf('code secret non')>-1)txt='Le script publié sur Google est une ancienne version. Dans Apps Script : Déployer → Gérer les déploiements → crayon → Nouvelle version → Déployer. Vérifiez aussi que vous avez collé le dernier fichier GSC_Backend_Commandes.gs.';
    else if(m==='service'||(m&&m!=='Failed to fetch'&&m.indexOf('NetworkError')<0&&m.indexOf('Load failed')<0))txt='Le service a refusé la demande : '+m;
    else txt='Impossible de joindre le service (internet coupé ou adresse incorrecte).';
    syncMsg(txt);
    if(manual)toast(txt);
  }).then(function(){syncing=false;});
}

function ctExtract(txt){
  var EM=/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,PH=/(?:\+|00)?\d[\d\s().-]{7,17}\d/g;
  var blocks=String(txt).split(/\n\s*\n+/).map(function(b){return b.trim();}).filter(Boolean);
  if(blocks.length===1){var ls=blocks[0].split('\n').filter(function(l){return l.trim();});if(ls.length>1&&ls.filter(function(l){return l.match(EM)||l.match(PH);}).length>=2)blocks=ls;}
  var recs=[];
  blocks.forEach(function(b){
    var em=b.match(EM)||[],ph=b.match(PH)||[];if(!em.length&&!ph.length)return;
    function g(re){var m=b.match(re);return m?m[1].trim():'';}
    var nom=g(/^\s*(?:Nom(?: et pr[ée]nom)?|Contact|Responsable|D[ée]cideur)\s*:\s*(.+)$/mi),ent=g(/^\s*(?:Entreprise|Soci[ée]t[ée]|Raison sociale)\s*:\s*(.+)$/mi);
    if(!nom&&!ent){var c0=ctClean(b.split('\n')[0].replace(/^[^:]{0,20}:\s*/,''));if(c0.length>1&&c0.length<70)nom=c0;}
    var web=(b.match(/(?:https?:\/\/|www\.)[^\s,;]+/i)||[''])[0];
    recs.push({'Nom':nom,'Entreprise':ent,'E-mail':em[0]||'','Téléphone':ph[0]||'','Site web':web,'Notes':b});
  });

var entrP={},guideP=1;
function gdef(id){return GUIDES.G[String(id)];}
function entrStart(p){
  var E=p.entr;
  if(!E){E=p.entr={proj:0,c:{},a:{},go:{},done:false};}
  return E;
}
function entrPid(p){
  var E=entrStart(p),id=entrP[p.id]||E.proj||parseInt(p.offreTestee,10)||0;
  if(!gdef(id)){var rec=p.diag?recommend(p.diag,p.diag.stade):[];id=rec.length?rec[0].p.id:1;}
  return id;
}
function gMethod(id){
  var g=gdef(id),c=cat(id);
  return '<div class="panel"><h2>Méthode d’entretien : '+id+'. '+esc(c.name)+'</h2><p><b>Objectif.</b> '+esc(g.obj)+'</p>'+
   '<div class="grid g2"><div><h3>Avant le rendez-vous</h3><ul class="gl">'+g.avant.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'+
   '<div><h3>Déroulé (60 minutes)</h3><table class="tb"><tbody>'+g.temps.map(function(t){return '<tr><td style="width:62px;white-space:nowrap"><b>'+t[0]+' min</b></td><td><b>'+esc(t[1])+'</b><br><span class="small muted">'+esc(t[2])+'</span></td></tr>';}).join('')+'</tbody></table></div></div></div>';
}
function gAfter(id){
  var g=gdef(id);
  return '<div class="panel"><h3>Si le projet ne convient pas</h3><ul class="gl">'+g.stop.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul><h3>Après l’entretien</h3><ul class="gl">'+g.apres.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';

function entrScore(id,go){
  var g=gdef(id),n=0;g.go.forEach(function(_,i){if(go&&go[i])n++;});
  var t=g.go.length,pct=Math.round(n/t*100),lab,cls;
  if(n===0){lab='Cochez les critères confirmés pendant l’entretien.';cls='';}
  else if(pct>=80){lab='Projet adapté : préparer le devis.';cls='st-5';}
  else if(pct>=50){lab='À confirmer : vérifier les critères manquants avant le devis.';cls='st-2';}
  else{lab='Peu adapté : voir « Si le projet ne convient pas » ci-dessous.';cls='st-4';}
  return '<p><span class="tag '+cls+'">'+n+' / '+t+' critères</span> '+esc(lab)+'</p>';
}

function parseCSV(t){
  t=String(t).replace(/^﻿/,'');
  var first=t.split(/\r?\n/)[0]||'',del=(first.split(';').length>=first.split(',').length)?';':',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===del){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[];}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}

}

  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(Date.now()<until){document.getElementById('lockmsg').textContent='Trop d’essais. Patientez quelques secondes.';return;}
    pinCheck(i.value).then(function(ok){
      if(ok){fails=0;try{sessionStorage.setItem('gscPlatOk','1');}catch(x){}unlocked=true;idleAt=Date.now();start();}
      else{fails++;if(fails>=5){until=Date.now()+30000;fails=0;}document.getElementById('lockmsg').textContent='Code incorrect.';i.value='';i.focus();}
    });
  });
}
function start(){
  var ok=false;try{ok=sessionStorage.getItem('gscPlatOk')==='1';}catch(e){}
  if(pinSet()&&!ok){unlocked=false;showLock();return;}
  unlocked=true;
  if(!location.hash)location.hash='#/dash';else render();
  syncStart();
}
/* ---------- événements ---------- */
function formVals(f){var o={};$$('input,select,textarea',f).forEach(function(e){if(e.name&&e.type!=='radio')o[e.name]=e.value;});return o;}
document.addEventListener('click',function(e){
  var go=e.target.closest('[data-go]');
  if(go&&!e.target.closest('a,button')){location.hash=go.dataset.go;return;}
  var cp=e.target.closest('[data-copy]');
  if(cp){copyText(cp.dataset.copy,cp);return;}
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id,p;
  if(a==='import-csv'){$('#fcsv').click();}
  else if(a==='export-csv'){exportCSV();}
  else if(a==='mv'){p=getP(id);var i=stIdx(p.statut)+parseInt(el.dataset.d,10);if(i>=0&&i<STATUTS.length){setStatut(p,STATUTS[i]);save();render();}}
  else if(a==='del-p'){if(confirm('Supprimer ce prospect et ses devis ?')){S.prospects=S.prospects.filter(function(x){return x.id!==id;});save();location.hash='#/prospects';}}
  else if(a==='dv-view'){var q=getP(route().id);openSheet(q.id,el.dataset.num);}
  else if(a==='dv-del'){if(confirm('Supprimer ce devis ?')){var q2=getP(route().id);q2.devis=q2.devis.filter(function(d){return d.num!==el.dataset.num;});addHist(q2,'Devis '+el.dataset.num+' supprimé');save();render();}}
  else if(a==='dv-print'){window.print();}
  else if(a==='dv-sent'){markSent(el.dataset.pid,el.dataset.num);toast('Devis marqué comme envoyé. Relance prévue dans 5 jours.');}
  else if(a==='close-modal'){$('#modal').innerHTML='';render();}
  else if(a==='exp-json'){download('sauvegarde-plateforme-gsc-'+today()+'.json',JSON.stringify(S),'application/json');}
  else if(a==='imp-json'){$('#fjson').click();}
  else if(a==='demo'){demo();}
  else if(a==='imp-order'){orderModal('');}
  else if(a==='order-go'){importOrder($('#ordtxt').value);}
  else if(a==='sync-now'){var sf=el.closest('form');if(sf&&sf.dataset.form==='sync'){var sv=formVals(sf);S.settings.syncUrl=(sv.syncUrl||'').trim();S.settings.syncKey=(sv.syncKey||'').trim();save();}syncOrders(true);}
  else if(a.indexOf('entr-')===0){entrAct(a,el);}
  else if(a.indexOf('rp-')===0){rapportAct(a,el);}
  else if(a.indexOf('fac-')===0){facAct(a,el);}
  else if(a==='guide-print'){entrSheet(null,parseInt(el.dataset.id,10));}
  else if(a==='lock'){lockNow();}
  else if(a==='pin-off'){
    var cur=prompt('Entrez le code actuel pour retirer la protection :');
    if(cur!==null)pinCheck(cur).then(function(ok){if(ok){localStorage.removeItem(KEYPIN);toast('Code retiré.');render();}else toast('Code incorrect.');});
  }
  else if(a==='reset'){if(confirm('Tout effacer : prospects, devis et réglages ?')&&confirm('Dernière confirmation : cette action est définitive. Avez-vous exporté une sauvegarde ?')){S=defaults();save();render();toast('Données effacées.');}}
  else if(a==='restore-bak'){
    var b=[];try{b=JSON.parse(localStorage.getItem(KEYB)||'[]');}catch(x){}
    $('#modal').innerHTML='<div class="modal"><div class="box"><h2>Copies automatiques</h2>'+(b.length?b.slice().reverse().map(function(s,k){var i=b.length-1-k,n=0;try{n=JSON.parse(s.data).prospects.length;}catch(x){}return '<div class="row card"><span>'+new Date(s.d).toLocaleString('fr-FR')+' · '+n+' prospects</span><button class="btn sm" data-act="do-restore" data-i="'+i+'">Restaurer</button></div>';}).join(''):'<p class="muted">Aucune copie pour le moment.</p>')+'<button class="btn line" data-act="close-modal">Fermer</button></div></div>';
  }
  else if(a==='do-restore'){var bb=JSON.parse(localStorage.getItem(KEYB)||'[]'),it=bb[parseInt(el.dataset.i,10)];if(it&&confirm('Remplacer les données actuelles par cette copie ?')){S=JSON.parse(it.data);save();$('#modal').innerHTML='';render();toast('Copie restaurée.');}}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  var t=f.dataset.form,p;
  if(t==='prospect'){
    var v=formVals(f);
    if((v.nom||'').trim().length<2){$('#fmsg').textContent='Indiquez le nom du prospect.';$('#f-nom').focus();return;}
    if(v.email&&!validEmail(v.email)){$('#fmsg').textContent='Adresse e-mail invalide.';$('#f-email').focus();return;}
    if(f.dataset.id){
      p=getP(f.dataset.id);var oldSt=p.statut;
      COLS.forEach(function(k){if(k!=='id'&&k!=='dateSubmission'&&v[k]!==undefined)p[k]=v[k].trim();});
      if(p.statut!==oldSt){var ns=p.statut;p.statut=oldSt;setStatut(p,ns);}
      p.dateDerniereAction=today();addHist(p,'Fiche modifiée');save();toast('Prospect enregistré.');render();
    }else{
      if(isDup(v)&&!confirm('Un prospect avec le même e-mail ou téléphone existe déjà. L’ajouter quand même ?'))return;
      var o={};COLS.forEach(function(k){if(k!=='id'&&v[k]!==undefined)o[k]=v[k].trim();});
      if(!o.prochaineAction){o.prochaineAction='Planifier le diagnostic gratuit';o.dateProchaineAction=addDays(today(),2);}
      p=newProspect(o);save();toast('Prospect ajouté.');location.hash='#/p/'+p.id;
    }
  }else if(t==='diag'){
    p=getP(f.dataset.id);var dg=readDiag(f);
    if(!diagScore(dg)){toast('Évaluez au moins un besoin.');return;}
    p.diag=dg;delete p.diagDraft;if(dg.stade)p.stade=dg.stade;
    if(stIdx(p.statut)<2){setStatut(p,'Diagnostic réalisé');}
    p.prochaineAction='Envoyer le devis (sous 48 h)';p.dateProchaineAction=addDays(today(),2);
    var sc=diagScore(dg);addHist(p,'Diagnostic réalisé : maturité '+sc.score+'/100 ('+sc.label+')');
    save();DV=null;toast('Diagnostic enregistré.');render();
  }else if(t==='dv'){
    p=getP(route().id);genDevis(p,(f.elements.notes.value||'').trim());
  }else if(t==='params'){
    var q=formVals(f),s=S.settings;
    s.consultants=q.consultants.split(',').map(function(x){return x.trim();}).filter(Boolean);if(!s.consultants.length)s.consultants=['Consultant'];
    ['phone','whatsapp','email','rdv','website','legal'].forEach(function(k){s[k]=q[k].trim();});
    s.whatsapp=digits(s.whatsapp);s.validite=parseInt(q.validite,10)||15;save();toast('Paramètres enregistrés.');
  }else if(t==='catalog'){
    var c=formVals(f);S.settings.catalog=CATALOG.map(function(x){var n=parseInt(c['c'+x.id],10);return {id:x.id,price:isNaN(n)||n<0?x.price:n};});save();toast('Prix enregistrés.');
  }else if(t==='pin'){
    var pv=formVals(f),msg=$('#pinmsg');
    if((pv.pin1||'').length<4){msg.textContent='Le code doit contenir au moins 4 caractères.';return;}
    if(pv.pin1!==pv.pin2){msg.textContent='Les deux codes ne sont pas identiques.';return;}
    var setIt=function(){hashPin(pv.pin1).then(function(h){localStorage.setItem(KEYPIN,h);try{sessionStorage.setItem('gscPlatOk','1');}catch(x){}toast('Code enregistré.');render();});};
    if(pinSet())pinCheck(pv.cur||'').then(function(ok){if(ok)setIt();else msg.textContent='Code actuel incorrect.';});else setIt();
  }else if(t==='sync'){
    var sy=formVals(f),su=(sy.syncUrl||'').trim();
    if(su&&su.indexOf('https://')!==0){syncMsg('L’adresse doit commencer par https://');return;}
    S.settings.syncUrl=su;S.settings.syncKey=(sy.syncKey||'').trim();save();toast('Connexion enregistrée.');render();if(syncOn())syncStart();
  }else if(t==='fact'){
    var fv=formVals(f),fs=S.settings;
    ['raison','adresse','ninea','rccm','payInfo','tvaOn','tvaMode'].forEach(function(k){fs[k]=(fv[k]||'').trim();});
    fs.tvaRate=Math.max(0,parseFloat(fv.tvaRate))||0;fs.facNum=Math.max(1,parseInt(fv.facNum,10)||1);
    save();toast('Facturation enregistrée.');render();
  }else if(t==='rapport'){
    rpSave(f);toast('Rapport enregistré.');render();
  }else if(t==='entr'){
    entrSave(f);
  }else if(t==='tpl'){
    var m=formVals(f);S.settings.tpl.forEach(function(x){if(m[x.id]!==undefined)x.m=m[x.id];});save();toast('Modèles enregistrés.');
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.filt==='q'){filt.q=el.value;refreshList();}
});
document.addEventListener('change',function(e){
  var el=e.target,f;
  if(el.dataset&&el.dataset.filt){filt[el.dataset.filt]=el.value;refreshList();return;}
  if(el.id==='fcsv'&&el.files[0]){var r=new FileReader();r.onload=function(){importCSV(r.result);};r.readAsText(el.files[0],'utf-8');el.value='';return;}
  if(el.id==='fjson'&&el.files[0]){var r2=new FileReader();r2.onload=function(){try{var o=JSON.parse(r2.result);if(!o.prospects||!o.settings)throw 0;if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){S=o;S.settings=Object.assign(defaults().settings,S.settings);save();render();toast('Sauvegarde restaurée.');}}catch(x){toast('Fichier de sauvegarde invalide.');}};r2.readAsText(el.files[0]);el.value='';return;}
  if(el.dataset&&el.dataset.fpay){facPay(el);return;}
  if(el.hasAttribute&&el.hasAttribute('data-msgp')){msgP=el.value;render();return;}
  if(el.hasAttribute&&el.hasAttribute('data-entrp')){entrP[route().id]=parseInt(el.value,10);render();return;}
  if(el.dataset&&el.dataset.dvst){
    var p=getP(route().id),d=p.devis.filter(function(x){return x.num===el.dataset.dvst;})[0],ns=el.value;
    d.statut=ns;
    if(ns==='envoyé'){setStatut(p,'Devis envoyé');p.prochaineAction='Relancer le devis '+d.num;p.dateProchaineAction=addDays(today(),5);}
    else if(ns==='accepté'){setStatut(p,'Signé / Client','devis '+d.num);p.prochaineAction='Réunion de démarrage';p.dateProchaineAction=addDays(today(),3);}
    else if(ns==='refusé'){setStatut(p,'Perdu','devis '+d.num+' refusé');p.prochaineAction='';p.dateProchaineAction='';}
    addHist(p,'Devis '+d.num+' : '+ns);
    var nf=ns==='accepté'?autoFacture(p,d):null;
    save();render();if(nf){toast('Devis accepté : facture '+nf.num+' générée.');location.hash='#/p/'+p.id+'/fact';}return;
  }
  f=el.closest&&el.closest('form[data-form]');
  if(f&&f.dataset.form==='diag'){$('#dgres').innerHTML=diagResult(readDiag(f));}
  if(f&&f.dataset.form==='dv'){dvUpdate();}
  if(f&&f.dataset.form==='entr'){entrSave(f,true);}
  if(f&&f.dataset.form==='rapport'){rpSave(f);}
});
document.addEventListener('dragstart',function(e){var k=e.target.closest&&e.target.closest('.kc');if(k){e.dataTransfer.setData('text/plain',k.dataset.id);e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',function(e){var c=e.target.closest&&e.target.closest('.col');if(c){e.preventDefault();c.classList.add('over');}});
document.addEventListener('dragleave',function(e){var c=e.target.closest&&e.target.closest('.col');if(c)c.classList.remove('over');});
document.addEventListener('drop',function(e){
  var c=e.target.closest&&e.target.closest('.col');if(!c)return;
  e.preventDefault();var p=getP(e.dataTransfer.getData('text/plain'));
  if(p&&c.dataset.col!==p.statut){setStatut(p,c.dataset.col);save();render();}
});
window.addEventListener('hashchange',function(){if(unlocked)render();});
['click','keydown','input'].forEach(function(ev){document.addEventListener(ev,function(){idleAt=Date.now();},true);});
setInterval(function(){if(unlocked&&pinSet()&&Date.now()-idleAt>900000)lockNow();},30000);
start();
})();
</script></body></html>
